services:
  postgres:
    image: postgres:16
    container_name: leopet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: leopet_dev
      POSTGRES_USER: leopet
      POSTGRES_PASSWORD: leopet
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leopet -d leopet_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: leopet-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      NODE_ENV: production
      PORT: 8181
      DATABASE_URL: postgresql://leopet:leopet@postgres:5432/leopet_dev
      DB_SSL: "false"
      STORAGE_PROVIDER: cloudinary
      API_URL: "http://localhost:8181"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: