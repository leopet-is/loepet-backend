stages:
  - lint
  - test
  - build

variables:
  NODE_VERSION: "20"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"

cache:
  paths:
    - node_modules/
    - .npm/

before_script:
  - node --version
  - npm --version

# Lint
lint:
  stage: lint
  image: node:20
  script:
    - npm ci --legacy-peer-deps
    - npm run lint
  only:
    - merge_requests
    - main
    - develop

test:
  stage: test
  image: node:20
  services:
    - postgres:16
  variables:
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/postgres"
    DB_SSL: "false"
    STORAGE_PROVIDER: "local"
    NODE_ENV: "test"
  script:
    - npm ci
    - npm run test
  artifacts:
    paths:
      - coverage/
    expire_in: 30 days
  only:
    - merge_requests
    - main
    - develop
  allow_failure: true


